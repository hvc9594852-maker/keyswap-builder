name: Build Windows EXE

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build Windows Executable
        run: |
          go mod init keyswap
          go get github.com/atotto/clipboard
          go get github.com/go-vgo/robotgo
          go get github.com/robotn/gohook
          GOOS=windows GOARCH=amd64 CGO_ENABLED=1 CC=x86_64-w64-mingw32-gcc sudo apt-get update && sudo apt-get install -y gcc-mingw-w64
          GOOS=windows GOARCH=amd64 CGO_ENABLED=1 CC=x86_64-w64-mingw32-gcc go build -ldflags "-H windowsgui" -o KeySwap-Windows.exe main.go

      - name: Upload Finished EXE
        uses: actions/upload-artifact@v4
        with:
          name: KeySwap-Windows
          path: KeySwap-Windows.exe
