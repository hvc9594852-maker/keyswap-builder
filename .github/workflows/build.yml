name: Build Windows EXE

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install AutoHotkey and Compiler
        shell: powershell
        run: |
          choco install autohotkey.portable --version=2.0.18 -y
          choco install ahk2exe -y

      - name: Compile AHK to EXE
        shell: powershell
        run: |
          $ahk2exe = "C:\ProgramData\chocolatey\bin\Ahk2Exe.exe"
          $base = "C:\ProgramData\chocolatey\lib\autohotkey.portable\tools\AutoHotkey64.exe"
          
          # สั่งแปลงไฟล์ KeySwap.ahk เป็น KeySwap-Windows.exe
          & $ahk2exe /in "KeySwap.ahk" /out "KeySwap-Windows.exe" /base $base

      - name: Upload Finished EXE
        uses: actions/upload-artifact@v4
        with:
          name: KeySwap-Windows
          path: KeySwap-Windows.exe
